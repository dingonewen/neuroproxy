<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc">
  <title id="title">NeuroProxy architecture</title>
  <desc id="desc">Web and phone inputs lead to AI analysis and a reviewed graph. The graph supports memory recall and messaging through Photon, with replies returning to the graph.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#25212a"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#25212a}.title{font-size:23px;font-weight:bold}.detail{font-size:16px}.edge{fill:none;stroke:#25212a;stroke-width:2.5;marker-end:url(#arrow)}.box{stroke:#25212a;stroke-width:2.5}.note{font-size:14px;fill:#4b4650}</style>
  </defs>
  <rect width="1100" height="660" rx="18" fill="#fffefa"/>
  <rect class="box" x="30" y="30" width="235" height="84" rx="10" fill="#fff09b"/>
  <text class="title" x="147" y="64" text-anchor="middle">Web: voice or text</text><text class="detail" x="147" y="91" text-anchor="middle">React + TypeScript</text>
  <rect class="box" x="30" y="160" width="235" height="84" rx="10" fill="#fff09b"/>
  <text class="title" x="147" y="194" text-anchor="middle">Phone call</text><text class="detail" x="147" y="221" text-anchor="middle">Photon Voice + ElevenLabs</text>
  <rect class="box" x="330" y="95" width="260" height="84" rx="10" fill="#dff4f0"/>
  <text class="title" x="460" y="129" text-anchor="middle">AI analysis</text><text class="detail" x="460" y="156" text-anchor="middle">Extract context + suggestions</text>
  <rect class="box" x="655" y="95" width="265" height="84" rx="10" fill="#dff4f0"/>
  <text class="title" x="787" y="129" text-anchor="middle">User review</text><text class="detail" x="787" y="156" text-anchor="middle">Correct and save context</text>
  <rect class="box" x="655" y="260" width="265" height="100" rx="10" fill="#ffe77f"/>
  <text class="title" x="787" y="298" text-anchor="middle">Cognitive Action Graph</text><text class="detail" x="787" y="326" text-anchor="middle">SQLite + interactive view</text>
  <rect class="box" x="330" y="280" width="260" height="84" rx="10" fill="#dcecff"/>
  <text class="title" x="460" y="314" text-anchor="middle">Recall memory</text><text class="detail" x="460" y="341" text-anchor="middle">BM25 + linked sources</text>
  <rect class="box" x="30" y="280" width="235" height="84" rx="10" fill="#dcecff"/>
  <text class="title" x="147" y="314" text-anchor="middle">Ask a question</text><text class="detail" x="147" y="341" text-anchor="middle">Recover saved context</text>
  <rect class="box" x="655" y="440" width="265" height="84" rx="10" fill="#ffd3cb"/>
  <text class="title" x="787" y="474" text-anchor="middle">Message draft</text><text class="detail" x="787" y="501" text-anchor="middle">Review and approve</text>
  <rect class="box" x="330" y="440" width="260" height="84" rx="10" fill="#ffd3cb"/>
  <text class="title" x="460" y="474" text-anchor="middle">Photon iMessage</text><text class="detail" x="460" y="501" text-anchor="middle">Send and receive</text>
  <rect class="box" x="30" y="440" width="235" height="84" rx="10" fill="#ffd3cb"/>
  <text class="title" x="147" y="474" text-anchor="middle">Recipient</text><text class="detail" x="147" y="501" text-anchor="middle">Message + reply</text>
  <path class="edge" d="M265 72 H300 L330 115"/><path class="edge" d="M265 202 H300 L330 159"/><path class="edge" d="M590 137 H655"/><path class="edge" d="M787 179 V260"/>
  <path class="edge" d="M655 312 H590"/><path class="edge" d="M330 322 H265"/>
  <path class="edge" d="M787 360 V440"/><path class="edge" d="M655 482 H590"/><path class="edge" d="M330 482 H265"/>
  <path class="edge" d="M147 524 V575 H980 V310 H922"/>
  <text class="note" x="540" y="601" text-anchor="middle">Replies return through a signed webhook; optional AutoReply is separately enabled and labeled.</text>
</svg>
